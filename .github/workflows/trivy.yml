# Workflow for running security scan using Trivy
name: trivy

on:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to the GitHub Security tab
    if: github.event_name == 'schedule'
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4

  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    outputs:
      # Expose matched filters as job 'packages' output variable
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: it-at-m/lhm_actions/action-templates/actions/action-filter@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        id: filter
        with:
          filters: |
            docs: docs/**
            eai: eai/**
      - run: |
          echo ${{ toJSON(steps.filter.outputs.changes) }}

  # JOB to scan modified packages
  trivy-partial:
    needs: changes
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to the GitHub Security tab
    if: ${{ needs.changes.outputs.packages != '' && needs.changes.outputs.packages != '[]' }}
    strategy:
      matrix:
        # Parse JSON array containing names of all filters matching any of changed files
        # e.g. ['package1', 'package2'] if both package folders contains changes
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          path: ${{ matrix.package }}
